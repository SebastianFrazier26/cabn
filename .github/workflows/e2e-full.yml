name: E2E (full suite)

# The whole Playwright suite, non-gating: nightly and on demand. PRs run only
# the @core subset (ci.yml's browser-smoke) because this suite starves
# ubuntu-latest's CPU in software-GL ground bakes. Budgets are stretched with
# E2E_TIME_SCALE (see apps/demo/e2e/timeScale.ts). Scheduled runs only fire
# from the default branch.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-full:
    runs-on: ubuntu-latest
    # A starved run took ~1.7h before the cap; this suite is slow by nature,
    # so the cap is generous but still well under the 6h default.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      # Installed only in CI — see apps/demo/playwright.config.ts's doc on why
      # a developer machine should point PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH
      # at an already-cached browser instead.
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @cabn/demo exec playwright install --with-deps chromium
      - run: pnpm --filter @cabn/demo exec playwright test --workers=1
        env:
          E2E_TIME_SCALE: "3"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-full
          path: apps/demo/playwright-report
          retention-days: 7
      - name: Upload Playwright traces/screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-test-results-full
          path: apps/demo/test-results
          retention-days: 7
