name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm lint
      # Audits every dependency, dev tooling included, and fails only on
      # high/critical findings; lower severities are reported, not gated.
      - run: pnpm audit --audit-level=high
      - run: pnpm -r test
      # Tarball contents: no source maps, no src/, no shadow art in @cabn/cli.
      - run: pnpm check:packs

  browser-smoke:
    # The important check — two bugs so far only showed up in a real browser,
    # never in jsdom-based component tests. Runs against a `vite preview` of
    # the actual production build, not `vite dev`.
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      # Installed only in CI — see apps/demo/playwright.config.ts's doc on why
      # a developer machine should point PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH
      # at an already-cached browser instead.
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @cabn/demo exec playwright install --with-deps chromium
      - run: pnpm --filter @cabn/demo exec playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: apps/demo/playwright-report
          retention-days: 7
      - name: Upload Playwright traces/screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-test-results
          path: apps/demo/test-results
          retention-days: 7
