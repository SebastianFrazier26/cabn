name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@c85c95e3d7a0659589d5b1c59eaf7a3fe8b8e0e7 # v4.2.0
      - uses: pnpm/action-setup@d882d12c64e032187b2ecc2dab4ffbef111dfe63 # v4.0.1
      - uses: actions/setup-node@60edb5dd545a775178fac7f3be8c45d12908d4a6 # v4.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm lint
      # Audits every dependency, dev tooling included, and fails only on
      # high/critical findings; lower severities are reported, not gated.
      - run: pnpm audit --audit-level=high
      - run: pnpm -r test

  browser-smoke:
    # The important check — two bugs so far only showed up in a real browser,
    # never in jsdom-based component tests. Runs against a `vite preview` of
    # the actual production build, not `vite dev`.
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@c85c95e3d7a0659589d5b1c59eaf7a3fe8b8e0e7 # v4.2.0
      - uses: pnpm/action-setup@d882d12c64e032187b2ecc2dab4ffbef111dfe63 # v4.0.1
      - uses: actions/setup-node@60edb5dd545a775178fac7f3be8c45d12908d4a6 # v4.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      # Installed only in CI — see apps/demo/playwright.config.ts's doc on why
      # a developer machine should point PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH
      # at an already-cached browser instead.
      - name: Cache Playwright browsers
        uses: actions/cache@704facf57c6b0c1b153b5038e1af35e8ff47d0f5 # v4.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @cabn/demo exec playwright install --with-deps chromium
      - run: pnpm --filter @cabn/demo exec playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1054fa735e92bcaf56 # v4.5.0
        with:
          name: playwright-report
          path: apps/demo/playwright-report
          retention-days: 7
      - name: Upload Playwright traces/screenshots
        if: failure()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1054fa735e92bcaf56 # v4.5.0
        with:
          name: playwright-test-results
          path: apps/demo/test-results
          retention-days: 7
