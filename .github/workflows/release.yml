name: Release

# Manual trigger only — publishing is always a human decision, never a side
# effect of pushing to main. See README's "Releasing" section for the
# npm Trusted Publisher setup this workflow depends on (no NPM_TOKEN here).
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    # No publishing credentials here: everything that runs repo or
    # dependency code happens before the job that can mint an npm token.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test
      - run: pnpm lint
      # Tarball contents: no source maps, no src/, no shadow art in @cabn/cli.
      - run: pnpm check:packs
      # Audits every dependency including dev tools; fails on high/critical.
      - run: pnpm audit --audit-level=high

  publish:
    # The only job with id-token: write. The `npm` environment's required
    # reviewers gate it, and npm's trusted publisher should name this file and
    # that environment (README "Releasing") so a token from anywhere else is
    # refused.
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      # pnpm's own publish rather than `changeset publish`: under pnpm that
      # shells out to `pnpm publish` anyway but can't pass --provenance, and
      # NPM_CONFIG_PROVENANCE is no documented pnpm setting (pnpm 11 even moved
      # its OTP variable to PNPM_CONFIG_OTP). pnpm's native publish does the
      # npm OIDC token exchange itself. Already-published versions and private packages are skipped;
      # changeset's only other effect here was local git tags never pushed.
      - name: Publish changed packages
        run: pnpm publish -r --provenance --access public --no-git-checks --report-summary
