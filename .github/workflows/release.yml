name: Release

# Manual trigger only — publishing is always a human decision, never a side
# effect of pushing to main. See README's "Releasing" section for the
# npm Trusted Publisher setup this workflow depends on (no NPM_TOKEN here).
on:
  workflow_dispatch: {}

permissions:
  contents: read
  # Required for npm's OIDC-based Trusted Publishing — no long-lived
  # NPM_TOKEN secret exists in this repo at all.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Trusted Publishing needs a recent npm CLI. The exact minimum version
      # is asserted by npm's own docs, which this workflow was written
      # without live access to verify — pinned to the latest available at
      # authoring time (2026-09-27) as a reasonably-safe floor. Re-check
      # https://docs.npmjs.com/trusted-publishers before relying on this.
      - name: Use a recent npm
        run: npm install -g npm@12.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test
      - name: Publish changed packages
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: pnpm exec changeset publish
