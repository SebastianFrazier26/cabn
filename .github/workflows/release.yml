name: Release

# Manual trigger only — publishing is always a human decision, never a side
# effect of pushing to main. See README's "Releasing" section for the
# npm Trusted Publisher setup this workflow depends on (no NPM_TOKEN here).
on:
  workflow_dispatch: {}

# Job permissions are scoped: build/test = contents:read only;
# publish = id-token:write + contents:read, guarded by environment + main branch.
permissions:
  contents: read

jobs:
  build:
    # 2026-10-01: Test and build only; no publishing credentials here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@c85c95e3d7a0659589d5b1c59eaf7a3fe8b8e0e7 # v4.2.0
      - uses: pnpm/action-setup@d882d12c64e032187b2ecc2dab4ffbef111dfe63 # v4.0.1
      - uses: actions/setup-node@60edb5dd545a775178fac7f3be8c45d12908d4a6 # v4.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test
      - run: pnpm lint
      # Audits every dependency including dev tools; fails on high/critical.
      - run: pnpm audit --audit-level=high

  publish:
    # 2026-10-01: Publish job runs only on main, in a protected environment,
    # and is the only job with id-token:write for npm OIDC Trusted Publishing.
    # The environment settings in GitHub allow required reviewers.
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: npm
    permissions:
      contents: read
      # Trusted Publishing requires id-token:write; no NPM_TOKEN secret.
      id-token: write
    steps:
      - uses: actions/checkout@c85c95e3d7a0659589d5b1c59eaf7a3fe8b8e0e7 # v4.2.0
      - uses: pnpm/action-setup@d882d12c64e032187b2ecc2dab4ffbef111dfe63 # v4.0.1
      - uses: actions/setup-node@60edb5dd545a775178fac7f3be8c45d12908d4a6 # v4.1.0
        with:
          node-version: 22
          cache: pnpm
      # Trusted Publishing requires npm >= 11.5.1 and Node >= 22.14 (npm docs,
      # verified 2026-09-27); setup-node's `22` resolves to the latest 22.x.
      - name: Use a recent npm
        run: npm install -g npm@12.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Publish changed packages
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: pnpm exec changeset publish
